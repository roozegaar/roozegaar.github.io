<header class="site-header" id="siteHeader">
  <div class="container header-row">
    <a href="index.html" class="logo" aria-label="Roozegaar">
      <img class="logo-mark" src="images/logo-mark.png" alt="" width="30" height="30">
      <span class="logo-text"></span>
    </a>

    <nav class="nav" id="mainNav" aria-label="Main">
      <ul class="nav-links"></ul>
    </nav>

    <div class="header-controls">
      <button class="icon-btn lang-toggle" type="button" data-i18n-label="language" data-i18n-title="language">

      <button class="icon-btn theme-toggle" type="button" data-i18n-label="theme" data-i18n-title="theme">

        <i class="fa-solid fa-sun theme-icon-sun" aria-hidden="true"></i>
      </button>
      <button class="icon-btn mobile-menu-btn" type="button" aria-expanded="false" aria-controls="mainNav" data-i18n-label="menu">
