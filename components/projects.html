<section class="section section-timeline">
  <div class="container">
    <header class="section-head" data-reveal="fade">
      <h2 class="section-title" data-i18n="projects"></h2>
      <p class="section-sub" data-i18n="projects_sub"></p>
    </header>
    <div class="sort-bar" role="radiogroup" data-reveal="fade" data-i18n-label="sort_label">
      <button type="button" class="sort-btn" role="radio" data-sort="newest"><i class="fa-solid fa-arrow-down-wide-short" aria-hidden="true"></i><span data-i18n="sort_newest"></span></button>
      <button type="button" class="sort-btn" role="radio" data-sort="oldest"><i class="fa-solid fa-arrow-up-wide-short" aria-hidden="true"></i><span data-i18n="sort_oldest"></span></button>
      <button type="button" class="sort-btn" role="radio" data-sort="popular"><i class="fa-solid fa-star" aria-hidden="true"></i><span data-i18n="sort_popular"></span></button>
    </div>
    <div class="timeline-wrap">
      <div class="tl-spine" aria-hidden="true"><i></i></div>
      <ol class="timeline" id="projectsGrid"></ol>
    </div>
  </div>
</section>
