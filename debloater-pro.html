<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script>
      /* Apply language, direction and theme before first paint to avoid a flash. */
      (function () {
        try {
          var d = document.documentElement, h = location.hash.slice(1).toLowerCase();
          var l = (h === 'fa' || h === 'en') ? h : (localStorage.getItem('language') || (/^fa/i.test(navigator.language) ? 'fa' : 'en'));
          var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          d.lang = l; d.dir = l === 'fa' ? 'rtl' : 'ltr'; d.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <title>ROOZEGAAR</title>
